services:
  xibo-puppeteer-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xibo-puppeteer-bridge
    restart: unless-stopped
    env_file:
      - ./bridge.env
    ports:
      - "4100:3500"
    user: "10001:10001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3500/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  bridge_data:
  puppeteer_cache:

